<!doctype html><html lang="en"><meta charset="utf-8"><title>SERARA — asset review</title>
<style>body{margin:0;background:#222321;color:#e4ded0;font:14px system-ui}canvas{display:block}aside{position:absolute;left:28px;top:24px;width:240px}h1{font:25px Georgia;letter-spacing:7px;margin:0 0 12px}p{color:#b7b6ac;line-height:1.6}button{background:#383b35;color:#e9e7dd;border:1px solid #585b50;border-radius:4px;padding:9px 12px;margin:4px 4px 4px 0;cursor:pointer}#status{position:absolute;bottom:20px;left:28px;color:#b8bfaf}footer{position:absolute;right:24px;bottom:20px;font-size:12px;color:#9fa397}</style>
<aside><h1>SERARA</h1><p>Canonical asset review<br>Neutral mineral surface</p><div><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="head">Head</button></div><p>Deformation checks</p><div><button id="neutral">A-pose</button><button id="reach">Shoulders</button><button id="compress">Compression</button><button id="fingers">Finger curl</button><button id="clay">Flat clay</button></div></aside><div id="status">Loading GLB…</div><footer>Drag to orbit · Scroll to zoom</footer>
<script type="importmap">{"imports":{"three":"./verification/node_modules/three/build/three.module.js","three/addons/":"./verification/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#222321');const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100);camera.position.set(2.7,1.6,5.2);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.23,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xfff6dd,0x353840,2.1));for(const [pos,color,intensity]of [[[2,4,4],0xfff2dc,3],[[-3,2,1],0xcbdde4,1.5],[[1,3,-4],0xffe1b2,2]]){const l=new THREE.DirectionalLight(color,intensity);l.position.set(...pos);scene.add(l);}
const gltf=await new GLTFLoader().loadAsync('../outputs/SERARA_CANONICAL.glb');scene.add(gltf.scene);const bones=new Map(),original=new Map(),materials=new Map();let tris=0;gltf.scene.traverse(o=>{if(o.isBone){bones.set(o.name,o);original.set(o.name,o.quaternion.clone());}if(o.isMesh){o.frustumCulled=false;materials.set(o,o.material);tris+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});
function rot(name,axis,d){bones.get(name).rotateOnAxis(new THREE.Vector3(...axis),THREE.MathUtils.degToRad(d));}function reset(){for(const[n,b]of bones)b.quaternion.copy(original.get(n));}
function view(pos,target){camera.position.set(...pos);controls.target.set(...target);controls.update();}
function mode(name){document.querySelector('#status').textContent=`${name} · ${tris.toLocaleString()} triangles · ${bones.size} bones · Three.js r${THREE.REVISION}`;}
document.querySelector('#front').onclick=()=>view([0,1.22,5],[0,1.22,0]);document.querySelector('#side').onclick=()=>view([5,1.22,0],[0,1.22,0]);document.querySelector('#back').onclick=()=>view([0,1.22,-5],[0,1.22,0]);document.querySelector('#head').onclick=()=>view([.34,2.20,1.0],[0,2.16,0]);
document.querySelector('#neutral').onclick=()=>{reset();view([2.7,1.6,5.2],[0,1.23,0]);mode('Neutral A-pose');};
document.querySelector('#reach').onclick=()=>{reset();rot('LeftArm',[0,0,1],-65);rot('RightArm',[0,0,1],65);rot('Neck',[1,0,0],20);rot('Head',[0,1,0],35);for(const s of ['Left','Right'])rot(s+'ForeArm',[1,0,0],60);view([2.7,1.6,5.2],[0,1.23,0]);mode('Shoulder and neck check');};
document.querySelector('#compress').onclick=()=>{reset();rot('Spine',[1,0,0],-20);rot('Spine1',[1,0,0],-15);rot('Neck',[1,0,0],-16);for(const s of ['Left','Right']){rot(s+'UpLeg',[1,0,0],-90);rot(s+'Leg',[1,0,0],120);rot(s+'Foot',[1,0,0],-30);rot(s+'ForeArm',[1,0,0],70);}view([2.5,1.8,4],[0,1.35,0]);mode('Pelvis and knee compression');};
document.querySelector('#fingers').onclick=()=>{reset();for(const s of ['Left','Right'])for(const f of ['Thumb','Index','Middle','Ring','Little'])for(let j=1;j<=3;j++)rot(`${s}Hand${f}${j}`,[1,0,0],j===1?32:55);view([1.1,1.3,-.6],[.57,1.04,0]);mode('Five-finger articulation');};
let clay=false;const clayMat=new THREE.MeshStandardMaterial({color:'#c3bdb0',roughness:.82});document.querySelector('#clay').onclick=()=>{clay=!clay;for(const[o,m]of materials)o.material=clay?clayMat:m;};
onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};function tick(){controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);}mode('Neutral A-pose');tick();
</script></html>
