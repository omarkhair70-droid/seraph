name: SERARA Performance Proof

on:
  push:
    branches: ["lab/serara-interactive-presence-20260923"]
    paths:
      - "components/seraph/SeraraCanonicalBody.tsx"
      - "components/seraph/SeraraPerceptionSensor.tsx"
      - "components/seraph/serara-performance.ts"
      - "components/seraph/serara-state.ts"
      - "components/seraph/SeraphWorld.tsx"
      - "components/seraph/CinematicChamberVFX.tsx"
      - "components/seraph/serara-sonic.ts"
      - "tools/capture-serara-performance-proof.mjs"
      - ".github/workflows/serara-performance-proof.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "components/seraph/SeraraCanonicalBody.tsx"
      - "components/seraph/SeraraPerceptionSensor.tsx"
      - "components/seraph/serara-performance.ts"
      - "components/seraph/serara-state.ts"
      - "components/seraph/SeraphWorld.tsx"
      - "components/seraph/CinematicChamberVFX.tsx"
      - "components/seraph/serara-sonic.ts"
      - "tools/capture-serara-performance-proof.mjs"
      - ".github/workflows/serara-performance-proof.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install proof browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build THE BODY
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/serara-performance-proof.log 2>&1 &
          echo $! > /tmp/serara-performance-proof.pid

      - name: Wait for THE BODY
        run: |
          node <<'NODE'
          const url =
            "http://127.0.0.1:3000/the-body?performanceProof=1";
          const wait = (ms) =>
            new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 0; attempt < 90; attempt += 1) {
            try {
              const response = await fetch(url);
              if (response.ok) {
                console.log("THE BODY performance proof ready:", response.status);
                process.exit(0);
              }
            } catch {}

            await wait(1000);
          }

          console.error("THE BODY performance proof did not become ready.");
          process.exit(1);
          NODE

      - name: Capture embodied performance proof
        run: node tools/capture-serara-performance-proof.mjs

      - name: Upload performance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serara-performance-proof
          path: artifacts/serara-performance-proof
          if-no-files-found: error
