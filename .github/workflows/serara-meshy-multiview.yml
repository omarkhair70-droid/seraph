name: SERARA Meshy Multi-View Reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - artifact/serara-3d-build-20260922
    paths:
      - 'tools/serara3d/meshy_multiview.py'
      - '.github/workflows/serara-meshy-multiview.yml'

permissions:
  contents: read

jobs:
  reconstruct-serara:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
      SERARA_MESHY_OUT: SERARA_MESHY_FINAL
      SERARA_FRONT_URL: https://at.adobe.com/c974S3B9yHNvAsil
      SERARA_THREE_QUARTER_URL: https://at.adobe.com/9nM4ny7AEdTDnlVv
      SERARA_SIDE_URL: https://at.adobe.com/UN1XvDEnywfnY4f6
      SERARA_BACK_URL: https://at.adobe.com/cvvOWMataXbPRjqZ

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify Python
        run: python --version

      - name: Reconstruct SERARA from four canonical views
        run: python tools/serara3d/meshy_multiview.py

      - name: Inventory result
        if: always()
        run: |
          echo "SERARA output inventory"
          find SERARA_MESHY_FINAL -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true

      - name: Upload reconstruction evidence and models
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SERARA_MESHY_FINAL
          path: SERARA_MESHY_FINAL/
          if-no-files-found: warn
          compression-level: 4
          retention-days: 30
