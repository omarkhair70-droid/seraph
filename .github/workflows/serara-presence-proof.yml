name: SERARA Presence Proof

on:
  push:
    branches: ["lab/serara-interactive-presence-20260923"]
    paths:
      - "components/seraph/**"
      - "docs/lab/**"
      - ".github/workflows/serara-presence-proof.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "components/seraph/**"
      - "docs/lab/**"
      - ".github/workflows/serara-presence-proof.yml"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install proof browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build THE BODY
        run: npm run build

      - name: Start local production server
        run: |
          nohup npm start -- -H 127.0.0.1 > /tmp/serara-presence-proof.log 2>&1 &
          echo $! > /tmp/serara-presence-proof.pid

      - name: Wait for THE BODY
        run: |
          node <<'NODE'
          const url = "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace";
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 0; attempt < 90; attempt += 1) {
            try {
              const response = await fetch(url);
              if (response.ok) {
                console.log("THE BODY ready:", response.status);
                process.exit(0);
              }
            } catch {}

            await wait(1000);
          }

          console.error("THE BODY did not become ready.");
          process.exit(1);
          NODE

      - name: Capture deterministic visual proof
        run: |
          mkdir -p artifacts/serara-presence-proof

          npx playwright screenshot             --browser=chromium             --viewport-size="1440,1000"             --wait-for-timeout=900             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/desktop-01-arrival.png

          npx playwright screenshot             --browser=chromium             --viewport-size="1440,1000"             --wait-for-timeout=3600             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/desktop-02-recognition.png

          npx playwright screenshot             --browser=chromium             --viewport-size="1440,1000"             --wait-for-timeout=6800             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/desktop-03-afterimage.png

          npx playwright screenshot             --browser=chromium             --device="iPhone 13"             --wait-for-timeout=900             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/mobile-01-arrival.png

          npx playwright screenshot             --browser=chromium             --device="iPhone 13"             --wait-for-timeout=3600             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/mobile-02-recognition.png

          npx playwright screenshot             --browser=chromium             --device="iPhone 13"             --wait-for-timeout=6800             "http://127.0.0.1:3000/the-body?presenceProof=1&pose=grace"             artifacts/serara-presence-proof/mobile-03-afterimage.png

          printf '%s\n'             "commit=$GITHUB_SHA"             "route=/the-body?presenceProof=1&pose=grace"             "sequence=arrival@0.9s recognition@3.6s afterimage@6.8s"             > artifacts/serara-presence-proof/proof-manifest.txt

      - name: Upload presence proof
        uses: actions/upload-artifact@v4
        with:
          name: serara-presence-proof
          path: artifacts/serara-presence-proof
          if-no-files-found: error
