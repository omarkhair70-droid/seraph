name: SERARA 3D Production Build V2

on:
  push:
    branches:
      - artifact/serara-3d-build-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-serara:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Restore Blender builder
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path('tools/serara3d/build_serara.py.gz.b64').read_text().strip()
          pathlib.Path('tools/serara3d/build_serara.py').write_bytes(gzip.decompress(base64.b64decode(src)))
          PY
          python -m py_compile tools/serara3d/build_serara.py

      - name: Install Blender 5.2.2 LTS production runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri             libx11-6 libxi6 libxrender1 libxfixes3 libxxf86vm1 libsm6 libice6
          curl -fL --retry 3             https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz             -o /tmp/blender.tar.xz
          sudo mkdir -p /opt/blender
          sudo tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          blender --version
          blender -b --python-expr "import numpy; print('BLENDER_NUMPY=' + numpy.__version__)"

      - name: Build rigged SERARA asset
        env:
          SERARA_OUT_DIR: ${{ github.workspace }}/SERARA_3D_FINAL
        run: |
          blender -b --python tools/serara3d/build_serara.py
          test -s SERARA_3D_FINAL/SERARA.blend
          test -s SERARA_3D_FINAL/SERARA.glb
          test -s SERARA_3D_FINAL/SERARA_BUILD_REPORT.json
          cat SERARA_3D_FINAL/SERARA_BUILD_REPORT.json

      - name: Upload production deliverables
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SERARA_3D_FINAL
          path: SERARA_3D_FINAL/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
